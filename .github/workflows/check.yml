name: FirstScene development checks
"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      CI: "true"
      FIRSTSCENE_CI_DISPOSABLE: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: false
          set-safe-directory: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
          package-manager-cache: false
      - run: npm install --global pnpm@10.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm build:packages
      - run: pnpm db:ci:up
      - run: node tools/database/ci-run.mjs pnpm db:prepare-test
      - run: node tools/database/ci-run.mjs pnpm db:ci:verify
      - run: node tools/database/ci-run.mjs pnpm check:ci
      - run: pnpm container:build
      - run: node tools/database/ci-run.mjs pnpm container:smoke
      - name: Remove only owned disposable database
        if: always()
        run: pnpm db:ci:down
      - name: Upload redacted reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firstscene-redacted-evidence
          path: |
            evidence/qa/ci-run/
            evidence/container/startup.json
            evidence/container/smoke.json
            evidence/ci/prepare-test.json
          if-no-files-found: error
