name: Temporary showcase compile diagnostics
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  compile:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/pwc-creative-showcase-architecture' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @firstscene/web build
      - run: pnpm exec vitest run tests/unit/discovery-model.test.ts tests/unit/reading-selectors.test.ts
