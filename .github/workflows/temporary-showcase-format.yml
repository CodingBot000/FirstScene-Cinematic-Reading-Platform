name: Temporary showcase source format
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  scoped-format:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/pwc-creative-showcase-architecture' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.14.0
      - run: pnpm install --frozen-lockfile
      - name: Format only changed TypeScript sources
        run: |
          pnpm exec prettier --write \
            apps/web/components/preview/*.tsx \
            apps/web/components/{PreviewCollection,Discovery,CinematicPrologue,CoverPortalLayer,useCatalogFlip,useDiscoveryQuery}.tsx \
            apps/web/components/useCatalogFlip.ts \
            apps/web/components/useDiscoveryQuery.ts \
            apps/web/lib/{discovery-model,graphics/cover-portal}.ts \
            apps/web/features/reading-sync/{selectors,store}.ts \
            packages/ui/src/*.tsx \
            tests/{unit/discovery-model,unit/reading-selectors,e2e/creative-showcase}.test.ts \
            2>/dev/null || true
          # Avoid deleting the job or pushing if formatting command failed.
          pnpm exec prettier --check \
            apps/web/components/preview/*.tsx \
            apps/web/components/{PreviewCollection,Discovery,CinematicPrologue,CoverPortalLayer}.tsx \
            apps/web/components/{useCatalogFlip,useDiscoveryQuery}.ts \
            apps/web/lib/{discovery-model,graphics/cover-portal}.ts \
            apps/web/features/reading-sync/{selectors,store}.ts \
            packages/ui/src/*.tsx \
            tests/unit/{discovery-model,reading-selectors}.test.ts \
            tests/e2e/creative-showcase.spec.ts
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web packages/ui/src tests/unit tests/e2e
          if ! git diff --cached --quiet; then
            git commit -m "style: format creative showcase and architecture files"
            git push origin HEAD:refs/heads/feat/pwc-creative-showcase-architecture
          fi
