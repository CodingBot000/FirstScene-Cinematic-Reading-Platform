name: FirstScene scoped formatting
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  format-feature-files:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/discovery-ci-polish-20261119' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.14.0
      - run: pnpm install --frozen-lockfile
      - name: Apply pinned Prettier to feature scope only
        run: |
          pnpm exec prettier --write \
            apps/web/components/Discovery.tsx \
            apps/web/components/PreviewCollection.tsx \
            apps/web/components/CinematicPrologue.tsx \
            apps/web/app/discover/page.tsx \
            tools/full-check.mjs \
            tests/e2e/discovery-catalog.spec.ts \
            tests/e2e/public.spec.ts \
            tests/e2e/scroll-chapters.spec.ts \
            tests/visual/helpers.ts
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/Discovery.tsx \
            apps/web/components/PreviewCollection.tsx \
            apps/web/components/CinematicPrologue.tsx \
            apps/web/app/discover/page.tsx \
            tools/full-check.mjs tests/e2e/discovery-catalog.spec.ts \
            tests/e2e/public.spec.ts tests/e2e/scroll-chapters.spec.ts \
            tests/visual/helpers.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format discovery and scroll changes"
            git push origin HEAD:refs/heads/feat/discovery-ci-polish-20261119
          fi
