name: Temporary Flip review fix formatter
"on":
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  format-review-fix:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/pwc-creative-showcase-architecture' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.14.0
      - run: pnpm install --frozen-lockfile
      - name: Apply pinned formatting and update the feature branch
        run: |
          pnpm exec prettier --write apps/web/components/useCatalogFlip.ts tests/e2e/creative-showcase.spec.ts
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/useCatalogFlip.ts tests/e2e/creative-showcase.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format review-driven Flip teardown and regression test"
            git push origin HEAD:refs/heads/feat/pwc-creative-showcase-architecture
          fi
