name: Temporary PR8 source formatting
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  scoped-format:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/mobile-journey-qa-p7' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.14.0
      - run: pnpm install --frozen-lockfile
      - name: Format edited product files
        run: |
          pnpm exec prettier --write apps/web/components/Discovery.tsx apps/web/features/library/Library.tsx
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/Discovery.tsx apps/web/features/library/Library.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(mobile): format updated discovery and library components"
            git push origin HEAD:refs/heads/fix/mobile-journey-qa-p7
          fi
