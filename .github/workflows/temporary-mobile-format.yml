name: Temporary cinematic source formatting
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  format-mobile-cinematic:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/mobile-cinematic-scene-layout' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.14.0
      - run: pnpm install --frozen-lockfile
      - name: Format only new and modified TSX/TS files
        run: |
          pnpm exec prettier --write \
            apps/web/components/CinematicPrologue.tsx \
            apps/web/lib/cinematic-scenes.ts \
            apps/web/lib/cinematic-scroll.ts \
            apps/web/app/layout.tsx \
            tests/unit/cinematic-scenes.test.ts \
            tests/e2e/mobile-cinematic-layout.spec.ts
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/CinematicPrologue.tsx \
            apps/web/lib/cinematic-scenes.ts \
            apps/web/lib/cinematic-scroll.ts \
            apps/web/app/layout.tsx \
            tests/unit/cinematic-scenes.test.ts \
            tests/e2e/mobile-cinematic-layout.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(landing): apply pinned formatter to cinematic modules"
            git push origin HEAD:refs/heads/fix/mobile-cinematic-scene-layout
          fi
