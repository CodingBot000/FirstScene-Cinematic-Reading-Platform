name: Temporary creative test format
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/pwc-creative-showcase-architecture' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.14.0
      - run: pnpm install --frozen-lockfile
      - name: Format WebGL fallback case
        run: |
          pnpm exec prettier --write tests/e2e/creative-showcase.spec.ts
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/creative-showcase.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(test): format GPU fallback E2E"
            git push origin HEAD:refs/heads/feat/pwc-creative-showcase-architecture
          fi
