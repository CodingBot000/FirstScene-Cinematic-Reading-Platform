name: Scroll UI temporary diagnostics
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  ui-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: Diagnose ESLint / Prettier
        run: pnpm lint
        continue-on-error: true
      - name: Diagnose TypeScript
        run: pnpm typecheck
        continue-on-error: true
      - name: Format scoped scroll UI files
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/cinematic-scroll-chapters' }}
        run: |
          pnpm exec prettier --write apps/web/components/CinematicPrologue.tsx apps/web/components/EditorialInterlude.tsx apps/web/components/PreviewCollection.tsx
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/CinematicPrologue.tsx apps/web/components/EditorialInterlude.tsx apps/web/components/PreviewCollection.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(landing): apply pinned Prettier formatter"
            git push origin HEAD:refs/heads/feat/cinematic-scroll-chapters
          fi
