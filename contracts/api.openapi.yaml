components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-firstscene
      description: Local HTTP uses firstscene_dev; production MUST use Secure __Host-firstscene.
  schemas:
    Empty:
      type: object
      additionalProperties: false
      properties: {}
      required: []
    Session:
      type: object
      additionalProperties: false
      properties:
        epoch: &id006
          type: string
          format: uuid
        expiresAt: &id008
          type: string
          format: date-time
      required:
      - epoch
      - expiresAt
    Preferences:
      type: object
      additionalProperties: false
      properties:
        mode: &id001
          enum:
          - cinematic
          - plain
        effects: &id002
          enum:
          - full
          - reduced
        fontSize: &id003
          enum:
          - 18
          - 20
          - 22
          - 24
        theme: &id004
          enum:
          - dark
          - light
        revision: &id005
          type: integer
          minimum: 0
      required:
      - mode
      - effects
      - fontSize
      - theme
      - revision
    PreferencesWrite:
      type: object
      additionalProperties: false
      properties:
        mode: *id001
        effects: *id002
        fontSize: *id003
        theme: *id004
        expectedRevision: *id005
        operationId: *id006
      required:
      - mode
      - effects
      - fontSize
      - theme
      - expectedRevision
      - operationId
    Progress:
      type: object
      additionalProperties: false
      properties:
        storyId: &id007
          type: string
          pattern: ^[a-z][a-z0-9-]{1,63}$
        contentVersion: &id009
          type: integer
          minimum: 1
        contentHash: &id010
          type: string
          pattern: ^[a-f0-9]{64}$
        sceneId: *id007
        beatId: *id007
        fraction: &id011
          type: number
          minimum: 0
          maximum: 1
        furthestOrdinal:
          type: integer
          minimum: 0
        completed: &id012
          type: boolean
        revision: *id005
        updatedAt: *id008
      required:
      - storyId
      - contentVersion
      - contentHash
      - sceneId
      - beatId
      - fraction
      - furthestOrdinal
      - completed
      - revision
      - updatedAt
    ProgressWrite:
      type: object
      additionalProperties: false
      properties:
        contentVersion: *id009
        contentHash: *id010
        sceneId: *id007
        beatId: *id007
        furthestOrdinal:
          type: integer
          minimum: 0
          maximum: 35
        fraction: *id011
        completed: *id012
        expectedRevision: *id005
        operationId: *id006
      required:
      - contentVersion
      - contentHash
      - sceneId
      - beatId
      - fraction
      - completed
      - expectedRevision
      - operationId
    Bookmark:
      type: object
      additionalProperties: false
      properties:
        storyId: *id007
        targetId:
          type: string
          pattern: ^(__story__|[a-z][a-z0-9-]{1,63})$
        contentVersion: *id009
        createdAt: *id008
      required:
      - storyId
      - targetId
      - contentVersion
      - createdAt
    BookmarkWrite:
      type: object
      additionalProperties: false
      properties:
        contentVersion: *id009
        operationId: *id006
      required:
      - contentVersion
      - operationId
    Mutation:
      type: object
      additionalProperties: false
      properties:
        operationId: *id006
      required:
      - operationId
    FeedbackWrite:
      type: object
      additionalProperties: false
      properties:
        storyId: *id007
        operationId: *id006
        code:
          enum:
          - helpful
          - distracting
          - too_fast
          - comfortable
      required:
      - storyId
      - operationId
      - code
    FeedbackAccepted:
      type: object
      additionalProperties: false
      properties:
        accepted:
          const: true
      required:
      - accepted
    Health:
      type: object
      additionalProperties: false
      properties:
        status:
          enum:
          - ok
          - unavailable
      required:
      - status
    Me:
      type: object
      additionalProperties: false
      properties:
        session:
          $ref: '#/components/schemas/Session'
        preferences:
          $ref: '#/components/schemas/Preferences'
        progress:
          type: array
          items:
            $ref: '#/components/schemas/Progress'
        bookmarks:
          type: array
          items:
            $ref: '#/components/schemas/Bookmark'
        serverPersistence:
          const: true
      required:
      - session
      - preferences
      - progress
      - bookmarks
      - serverPersistence
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
              pattern: ^[A-Z_]+$
            message:
              type: string
            requestId: *id006
            details:
              type: object
              additionalProperties: false
              properties:
                currentRevision: *id005
                currentProgress:
                  $ref: '#/components/schemas/Progress'
              required: []
          required:
          - code
          - message
          - requestId
      required:
      - error
